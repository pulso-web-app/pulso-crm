schema: spec-driven

context: |
  Language: English
  All artifacts must be written in English.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Repository: pulso-crm, an Angular 22 / Nx 23 Native Federation remote served on port 4201.
  Responsibilities: contacts routes and UI across domain, data-access, features, form, and interactions boundaries.
  Current maturity: the list reads shared root Firestore contacts with cursor pagination. Card dialogs persist edits with pending/success/failure feedback and reconcile confirmed results locally without extra reads. Create, detail, and edit routes remain UI scaffolds.
  Federation contract: remote name crm exposing ./Routes to pulso-shell.
  Quality gate: npm run check; route-contract changes also require shell integration verification.
  Boundaries: do not invent backend behavior, import sibling source code, or expose customer data.
githubCopilot:
  cloudAgent: false
rules:
  proposal:
    - State non-goals and data, UI, federation, and deployment impact.
  tasks:
    - Include relevant loading, empty, success, validation, and failure tests.
operations:
  apply:
    guidance:
      - Keep contact behavior in the documented feature boundaries.
