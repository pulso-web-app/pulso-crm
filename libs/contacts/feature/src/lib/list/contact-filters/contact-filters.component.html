<div class="filters-left">
  <mat-form-field appearance="outline" subscriptSizing="dynamic">
    <mat-label>Início do nome da empresa</mat-label>
    <ph-magnifying-glass
      matPrefix
      class="pulso-icon pulso-icon--field-prefix"
      size="18"
      aria-hidden="true"
    />
    <input matInput type="text" [(ngModel)]="searchContact" />
    @if (searchContact()) {
      <button
        matSuffix
        matIconButton
        class="pulso-icon-button"
        aria-label="Limpar busca"
        (click)="searchContact.set('')"
      >
        <ph-x
          class="pulso-icon pulso-icon--icon-button"
          size="18"
          aria-hidden="true"
        />
      </button>
    }
  </mat-form-field>
  <mat-form-field
    appearance="outline"
    subscriptSizing="dynamic"
    class="filter-select"
  >
    <mat-select
      [value]="selectedStage()"
      (selectionChange)="selectedStage.set($event.value)"
      placeholder="Estágio"
    >
      @for (stage of stages; track stage.value) {
        <mat-option [value]="stage.value">{{ stage.label }}</mat-option>
      }
    </mat-select>
    @if (selectedStage()) {
      <button
        matSuffix
        mat-icon-button
        class="pulso-icon-button"
        aria-label="Limpar Estágio"
        (click)="selectedStage.set(null); $event.stopPropagation()"
      >
        <ph-x
          class="pulso-icon pulso-icon--icon-button"
          size="18"
          aria-hidden="true"
        />
      </button>
    }
  </mat-form-field>

  <mat-form-field
    appearance="outline"
    subscriptSizing="dynamic"
    class="filter-select"
  >
    <mat-select
      [value]="selectedStatus()"
      (selectionChange)="selectedStatus.set($event.value)"
      placeholder="Status"
    >
      @for (status of statuses; track status.value) {
        <mat-option [value]="status.value">{{ status.label }}</mat-option>
      }
    </mat-select>
    @if (selectedStatus()) {
      <button
        matSuffix
        mat-icon-button
        class="pulso-icon-button"
        aria-label="Limpar Status"
        (click)="selectedStatus.set(null); $event.stopPropagation()"
      >
        <ph-x
          class="pulso-icon pulso-icon--icon-button"
          size="18"
          aria-hidden="true"
        />
      </button>
    }
  </mat-form-field>

  @if (hasActiveFilters()) {
    <button mat-button color="primary" (click)="clearAllFilters()">
      <ph-funnel-x
        class="pulso-icon pulso-icon--button-start"
        size="18"
        aria-hidden="true"
      />
      Limpar filtros
    </button>
  }
</div>

<div class="filters-right">
  <button
    mat-stroked-button
    color="primary"
    type="button"
    [disabled]="createDisabled()"
    (click)="importRequested.emit()"
  >
    <ph-upload-simple
      class="pulso-icon pulso-icon--button-start"
      size="18"
      aria-hidden="true"
    />
    Importar contatos
  </button>
  <button
    mat-flat-button
    color="primary"
    type="button"
    [disabled]="createDisabled()"
    (click)="createRequested.emit()"
  >
    <ph-plus
      class="pulso-icon pulso-icon--button-start"
      size="18"
      aria-hidden="true"
    />
    Novo contato
  </button>
</div>
